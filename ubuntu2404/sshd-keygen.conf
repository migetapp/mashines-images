#
# Generate this machine's own SSH host keys, on its own first boot.
#
# AlmaLinux gets this for free from sshd-keygen@.service. Ubuntu has no
# equivalent -- openssh-server ships ssh.service, ssh.socket and nothing else --
# because on Debian and Ubuntu the keys are made by the package's postinst, at
# install time. That is a build-time key, which is the one thing a machine image
# may never carry, so the Dockerfile deletes them and this puts them back where
# they belong.
#
# The empty ExecStartPre= is not a typo. A drop-in APPENDS to the list, so
# without the reset the unit's own `sshd -t` would run first, find no host key,
# and fail -- and ssh.service would never start at all. Clearing the list and
# restating both in the order they have to run is the only way in front of it.
#
# ssh-keygen -A creates only what is missing, so every boot after the first
# costs one stat per key type.
[Service]
ExecStartPre=
ExecStartPre=/usr/bin/ssh-keygen -A
ExecStartPre=/usr/sbin/sshd -t
