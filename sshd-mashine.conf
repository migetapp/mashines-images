#
# Root logs in by key, and by nothing else.
#
# Installed as /etc/ssh/sshd_config.d/10-mashine.conf. sshd takes the FIRST
# value it obtains for a keyword and reads the drop-in directory in sorted
# order, so the 10- prefix is what makes this beat the `PermitRootLogin yes`
# that distro packages drop in later. Check with `sshd -T`.
#
# prohibit-password permits root by key, certificate or hostbased, never by
# password. The two lines under it close the same door for every other account,
# and separately for PAM, whose keyboard-interactive path can otherwise accept a
# password even when PasswordAuthentication is no.
PermitRootLogin prohibit-password
PasswordAuthentication no
KbdInteractiveAuthentication no
