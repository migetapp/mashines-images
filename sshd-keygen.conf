#
# Generate this machine's own SSH host keys, on its own first boot. Shared by
# every Debian-family image.
#
# AlmaLinux gets this for free from sshd-keygen@.service. On Debian and Ubuntu
# the keys are made by openssh-server's postinst, at install time. That is a
# build-time key, which is the one thing a machine image may never carry, so the
# Dockerfile deletes them and this puts them back where they belong.
#
# Debian 13 does ship an sshd-keygen.service, and it is not a substitute: it is
# ConditionFirstBoot=yes, which is false as soon as /etc/machine-id is non-empty
# -- and installing systemd populates it during the build. A machine would boot
# with the condition already unmet, generate nothing, and never start sshd.
# Ubuntu 24.04 and Debian 12 ship no such unit at all.
#
# The empty ExecStartPre= is not a typo. A drop-in APPENDS to the list, so
# without the reset the unit's own `sshd -t` would run first, find no host key,
# and fail -- and ssh.service would never start at all. Clearing the list and
# restating both in the order they have to run is the only way in front of it.
#
# ssh-keygen -A creates only what is missing, so every boot after the first
# costs one stat per key type.
[Service]
ExecStartPre=
ExecStartPre=/usr/bin/ssh-keygen -A
ExecStartPre=/usr/sbin/sshd -t
